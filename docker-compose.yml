services:
  mysql:
    image: mysql:8.0
    container_name: opw-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-opw_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-open_publisher_web}
      MYSQL_USER: ${MYSQL_USER:-opw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-opw_password}
    ports:
      - "33061:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-opw_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: opw-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: opw-backend
    environment:
      APP_ENV: development
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-opw}:${MYSQL_PASSWORD:-opw_password}@mysql:3306/${MYSQL_DATABASE:-open_publisher_web}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
      LLM_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY:-}}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      VOLC_API_KEY: ${VOLC_API_KEY:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-open-publisher-web-secret-change-me}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-Admin@123456}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    container_name: opw-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  admin-frontend:
    build: ./frontend-admin
    container_name: opw-admin-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  mysql_data:


